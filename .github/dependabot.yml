version: 2
updates:
  - package-ecosystem: "maven"
    # One entry per module: each module pins its own versions, so the root
    # aggregator alone only gets one of them bumped.
    directories:
      - "/conference-buddy"
      - "/weather-mcp-server"
      - "/schedule-mcp-server"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    # Bundle every Maven bump, across all modules, into one pull request.
    groups:
      maven:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    groups:
      github-actions:
        patterns:
          - "*"
